# Runtime settings (shared). Per-machine overrides go in config/settings.local.yaml (git-ignored).
llm:
  backend: claude_cli        # claude -p (uses your Claude Code subscription)
  model: sonnet              # alias passed to `claude -p --model`
  timeout_sec: 240
  parallel: 3                # concurrent claude -p calls

embedding:
  ollama_url: http://localhost:11434
  model: bge-m3             # multilingual (Vietnamese + English in one vector space)
  dim: 1024                 # after changing model/dim run: uv run intel reembed

pipeline:
  lookback_days: 2           # only items published within this window are processed
  cluster_threshold: 0.60    # cosine similarity to join a cluster (calibrated for bge-m3)
  cluster_active_days: 14    # clusters older than this stop absorbing items
  analyze_top_n: 15          # how many clusters get CEO analysis per run
  reanalyze_growth: 3        # re-analyze a cluster if it gained this many new items
  fetch_fulltext: false      # download article bodies (slower, richer)

retention:
  raw_days: 90

# Items whose title matches any of these (case-insensitive regex) are dropped at collection.
noise_patterns:
  - "promo codes?"
  - "coupons?"
  - "\\d+% off"
  - "best .*deals"
  - "black friday|cyber monday"
  - "^tell hn: happy"
  - "discount codes?"
  - "^(the )?best .* (to buy|of 20\\d\\d)"
  - "horoscope|wordle|crossword"

# Auto-commit the Markdown vault after each run/weekly memo and push to GitHub.
# Off by default so people who clone this repo never push to someone else's remote.
# Turn it on per machine in config/settings.local.yaml (git-ignored), e.g.:
#   git: {auto_commit: true, auto_push: true}
git:
  auto_commit: false
  auto_push: false
  remote: origin
  paths: [vault]          # only these paths are committed; code changes are never auto-committed

# Predict: on-demand forecasts (runs only when you click Predict / run `intel predict`)
predict:
  default_model: claude-sonnet-5-5
  timeout_sec: 900
  models:                   # shown in the model picker; ids are passed to `claude -p --model`
    - {id: claude-opus-5-5, label: "Opus 5.5", note: "deepest reasoning, slowest"}
    - {id: claude-sonnet-5-5, label: "Sonnet 5.5", note: "balanced"}
    - {id: claude-fable-5-2, label: "Fable 5.2", note: "alternative perspective"}
    - {id: claude-haiku-5-5, label: "Haiku 5.5", note: "fastest, cheapest"}
